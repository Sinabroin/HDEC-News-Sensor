name: Editorial Weekly T&I

on:
  workflow_dispatch:
    inputs:
      force_dry_run:
        description: "Run offline preview only"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      publish_only:
        description: "Regenerate the current edition without delivery"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  schedule:
    - cron: "30 22 * * 2"
    - cron: "50 22 * * 2"

permissions:
  contents: write

concurrency:
  group: editorial-weekly-ti
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install editorial image dependency
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir "Pillow==12.3.0"

      - name: Verify editorial contracts offline
        run: |
          python3 -m py_compile app/editorial_briefings.py app/editorial_briefing_state.py scripts/run_editorial_briefing.py scripts/verify_weekly_tni_reference_parity.py scripts/verify_r4_ops7_weekly_production_gate.py scripts/verify_r4_ops7_real_photo_gate.py
          python3 scripts/verify_weekly_tni_reference_parity.py
          python3 scripts/verify_r4_ops7_real_photo_gate.py
          python3 scripts/verify_r4_ops7_weekly_production_gate.py

      - name: Offline preview when production gate is closed
        if: github.ref != 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.force_dry_run == 'true')
        run: |
          python3 scripts/run_editorial_briefing.py \
            --edition-type weekly \
            --preview \
            --preview-root "$RUNNER_TEMP/editorial-preview"

      - name: Build Weekly publication
        id: publish
        if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || github.event.inputs.force_dry_run != 'true')
        env:
          EDITORIAL_PRODUCTION: "1"
          EDITORIAL_RUNTIME_DIR: ${{ runner.temp }}/editorial-weekly
          NEWS_MODE: live
          NAVER_NEWS_ENABLED: "1"
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          REPORT_URL: ${{ vars.REPORT_URL || secrets.REPORT_URL || '' }}
        run: |
          PUBLISH_FLAG="--publish"
          if [ "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_only == 'true' }}" = "true" ]; then
            PUBLISH_FLAG="--republish"
          fi
          python3 scripts/run_editorial_briefing.py \
            --edition-type weekly \
            "$PUBLISH_FLAG" \
            --runtime-dir "$EDITORIAL_RUNTIME_DIR"

      - name: Commit and push exact Weekly publication files
        if: steps.publish.outputs.skipped == 'false'
        env:
          EDITION: ${{ steps.publish.outputs.edition }}
          IMAGE_MANIFEST_PATH: ${{ steps.publish.outputs.image_manifest_path }}
        run: |
          DATED_PATH="docs/editorial/weekly/${EDITION}.html"
          LATEST_PATH="docs/editorial/weekly/latest.html"
          FILES=("$DATED_PATH" "$LATEST_PATH")
          if [ -z "$IMAGE_MANIFEST_PATH" ]; then
            echo "ERROR: non-empty Weekly is missing its image manifest"
            exit 1
          fi
          FILES+=("$IMAGE_MANIFEST_PATH")
          mapfile -t IMAGE_PATHS < <(python3 - "$IMAGE_MANIFEST_PATH" "$EDITION" <<'PY'
          import json, pathlib, sys
          manifest_path, edition = pathlib.Path(sys.argv[1]), sys.argv[2]
          payload = json.loads(manifest_path.read_text(encoding="utf-8"))
          prefix = f"editorial/weekly/assets/{edition}/"
          if payload.get("edition_type") != "weekly" or payload.get("edition_key") != edition:
              raise SystemExit("image manifest identity mismatch")
          rows = payload.get("publication_image_assets")
          if not isinstance(rows, list) or len(rows) != payload.get("article_count"):
              raise SystemExit("image manifest asset count mismatch")
          for row in rows:
              relative = str(row.get("relative_path") or "")
              name = relative.removeprefix(prefix)
              if not relative.startswith(prefix) or not name or "/" in name or "\\" in name:
                  raise SystemExit("unsafe Weekly image asset path")
              print("docs/" + relative)
          PY
          )
          FILES+=("${IMAGE_PATHS[@]}")
          if [ -z "$(git status --porcelain -- "${FILES[@]}")" ]; then
            echo "Weekly publication already matches; continue to public verification"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$DATED_PATH" "$LATEST_PATH"
          git add -- "$IMAGE_MANIFEST_PATH" "${IMAGE_PATHS[@]}"
          git commit -m "chore: publish Weekly editorial brief ${EDITION}"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git merge --no-edit origin/main; then
              echo "ERROR: Weekly publication merge conflict; fail closed"
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: Weekly publication push failed"
              exit 1
            fi
          done

      - name: Verify public exact Weekly page and image assets before claim
        id: verify_public
        if: success() && steps.publish.outputs.delivery_authorized == 'true'
        env:
          EDITORIAL_PRODUCTION: "1"
          EDITORIAL_RUNTIME_DIR: ${{ runner.temp }}/editorial-weekly
          REPORT_URL: ${{ vars.REPORT_URL || secrets.REPORT_URL || '' }}
        run: |
          python3 scripts/run_editorial_briefing.py \
            --edition-type weekly \
            --verify-public \
            --runtime-dir "$EDITORIAL_RUNTIME_DIR"

      - name: Claim exact Weekly edition after public verification
        id: claim
        if: success() && steps.verify_public.outputs.resources_verified == 'true'
        env:
          EDITORIAL_PRODUCTION: "1"
          EDITORIAL_RUNTIME_DIR: ${{ runner.temp }}/editorial-weekly
          REPORT_URL: ${{ vars.REPORT_URL || secrets.REPORT_URL || '' }}
        run: |
          python3 scripts/run_editorial_briefing.py \
            --edition-type weekly \
            --claim \
            --runtime-dir "$EDITORIAL_RUNTIME_DIR"

      - name: Commit and push exact Weekly claim state file
        if: success() && steps.claim.outputs.state_changed == 'true'
        env:
          EDITION: ${{ steps.claim.outputs.edition }}
        run: |
          STATE_PATH="data/editorial_weekly_state.json"
          if [ -z "$(git status --porcelain -- "$STATE_PATH")" ]; then
            echo "ERROR: Weekly claim state output was declared but file is unchanged"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$STATE_PATH"
          git commit -m "chore: claim Weekly editorial delivery ${EDITION}"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git merge --no-edit origin/main; then
              echo "ERROR: Weekly claim state merge conflict; fail closed"
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: Weekly claim state push failed"
              exit 1
            fi
          done

      - name: Send claimed Weekly edition
        id: send
        if: success() && steps.claim.outputs.send_authorized == 'true'
        env:
          EDITORIAL_PRODUCTION: "1"
          EDITORIAL_RUNTIME_DIR: ${{ runner.temp }}/editorial-weekly
          REPORT_URL: ${{ vars.REPORT_URL || secrets.REPORT_URL || '' }}
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_SMTP_APP_PASSWORD: ${{ secrets.GMAIL_SMTP_APP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          TEAMS_CHANNEL_EMAIL: ${{ secrets.TEAMS_CHANNEL_EMAIL }}
        run: |
          python3 scripts/run_editorial_briefing.py \
            --edition-type weekly \
            --send \
            --runtime-dir "$EDITORIAL_RUNTIME_DIR"

      - name: Commit and push exact Weekly success state file
        if: success() && steps.send.outputs.state_changed == 'true'
        env:
          EDITION: ${{ steps.claim.outputs.edition }}
        run: |
          STATE_PATH="data/editorial_weekly_state.json"
          if [ -z "$(git status --porcelain -- "$STATE_PATH")" ]; then
            echo "ERROR: Weekly success state output was declared but file is unchanged"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$STATE_PATH"
          git commit -m "chore: record Weekly editorial delivery ${EDITION}"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git merge --no-edit origin/main; then
              echo "ERROR: Weekly success state merge conflict; fail closed"
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: Weekly success state push failed"
              exit 1
            fi
          done
