name: Teams AI News Watch

# D7-AK-6C — 10분 주기 경량 Teams 발송 감시.
# 새로 감지된 Tier 1 '중요·최우선' AI 기사, 또는 Tier 1이 전혀 없을 때
# publisher-factual Tier 2 '강한 관찰 신호' 최대 1건만 Teams 테스트1 채널(email_channel)에 발송한다.
# 전체 대시보드/Pages를 재빌드하거나 docs/daily를 수정하지 않는다 — 라이브 뉴스 메타데이터와
# validated live brief만 임시 파일(runner.temp)로 생성해 발송 판단에만 쓴다. 시장/기상 라이브 실측은
# 하지 않는다(뉴스 delta에는 불필요 → 경량 유지).
#
# ※ GitHub schedule은 UTC 기준 best-effort라 정확히 10분 간격을 보장하지 않는다(수 분 지연/건너뜀 가능).
#
# scheduled 실제 발송은 repo Variable TEAMS_AI_NEWS_WATCH='1' + 라이브 수집 성공(live_ok) +
# main branch + force_dry_run 아님 이 모두 필요하다. 수동 실제 발송은 watch=0 상태에서 명시적인
# production_canary=true + canary_cap=1로 정확히 한 건만 허용한다(수동 canary는 항상 1건).
# scheduled run은 D7-AK-6E R4-R6 배치 계약을 따른다: 자연 run당 0~5건(자격 있는 미발송 기사만,
# 채우기 금지), rollout cap은 repo Variable TEAMS_AI_NEWS_MAX_ARTICLES(1~5 존중, >5는 5로 clamp,
# 미설정 env는 안전한 1 주입). shadow_alert_delta는 더 이상
# 발송 조건이 아니다(중요도는 기사별 재사용 신호로 판정). 이 워크플로는 Teams 기사별 자동발송의
# 유일한 production owner이며, Telegram은 이 워크플로에서 절대 실행하지 않는다.
on:
  workflow_dispatch:
    inputs:
      force_dry_run:
        description: "Type 'true' to force dry-run (no send) even when the watch is enabled"
        required: false
        default: ""
      production_canary:
        description: "Type 'true' to allow one real Teams article while the scheduled watch is disabled"
        required: false
        default: "false"
      canary_cap:
        description: "Production canary safety cap. Real manual send requires exactly '1'."
        required: false
        default: "1"
  schedule:
    # GitHub schedule은 UTC 기준이며 best-effort라 정확히 10분 간격을 보장하지 않는다.
    - cron: '7,17,27,37,47,57 * * * *'

# state 파일(data/teams_push_state.json) 한 개만 commit/push 하려면 write 권한이 필요하다.
permissions:
  contents: write

# 10분 슬롯 실행을 직렬화해 겹침/중복 발송·state push 충돌을 막는다.
concurrency:
  group: teams-ai-news-watch
  cancel-in-progress: false

env:
  # 검증/기본은 항상 mock 안전 모드 (네트워크/비밀값 0건). live 수집은 아래 build step에서만 활성화.
  APP_MODE: mock
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  teams-ai-news-watch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 1) 게이트 (mock-safe · 비밀값/네트워크 0건). Teams 기사별 발송 계약 verifier들.
      - name: Verify pipeline (mock-safe, no secrets)
        run: |
          python3 -m py_compile scripts/send_teams_ai_push.py app/teams_ai_push.py app/watch_semantic_precision.py app/teams_push_state.py app/public_urls.py scripts/verify_r4_ops10h_autonomous_editorial_selection.py
          python3 scripts/verify_teams_ai_push.py
          python3 scripts/verify_teams_push_state.py
          python3 scripts/verify_teams_ai_push_dry_run.py
          python3 scripts/verify_teams_ai_push_workflow_dry_run.py
          python3 scripts/verify_teams_ai_push_production.py
          python3 scripts/verify_teams_validated_brief_semantic_equivalence.py
          python3 scripts/verify_teams_major_media_gate.py
          python3 scripts/verify_teams_strict_source_gate.py
          python3 scripts/verify_r4_ops10k_executive_materiality_depth.py
          python3 scripts/verify_stock_market_hard_exclusion.py
          python3 scripts/verify_r4_ops10h_autonomous_editorial_selection.py
          python3 scripts/verify_r4_ops7_watch_production_gate.py

      # 2) 라이브 뉴스 메타데이터만 임시 파일로 생성한다(공개 docs/daily·Pages 미변경·미게시).
      #    시장/기상은 기본 mock으로 두어 라이브 실측을 건너뛴다(뉴스 delta에는 불필요) — 경량 유지.
      #    build_executive_brief.py가 공개 RSS/Naver 수집을 정확히 한 번 수행하고, 명시적 health
      #    gate를 통과한 artifact를 sender가 직접 재사용한다. Mutable public dashboard는
      #    신규 후보/전송 상태의 권한이 아니다. live 수집 실패면 fail-closed.
      - name: Build live news metadata (temp only)
        id: build
        env:
          NEWS_MODE: live
          # Naver 보조 provider — 이미 생성된 repo secrets로 안전 주입 (값 미출력). 자격증명이
          # 없거나 실패해도 collector가 정직하게 skip하므로 live_ok 판정에는 영향이 없다.
          NAVER_NEWS_ENABLED: "1"
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          BRIEF_JSON="$RUNNER_TEMP/validated-live-brief.json"
          python3 scripts/build_executive_brief.py --output-json "$BRIEF_JSON"
          if VALIDATION="$(python3 scripts/build_news_censor.py \
            --brief-json "$BRIEF_JSON" \
            --require-live \
            --json 2>&1)"; then
            echo "$VALIDATION"
            echo "live_ok=true" >> "$GITHUB_OUTPUT"
            echo "NEWS_MODE=live · validated current article artifact ready (temp, not published)"
          else
            echo "$VALIDATION"
            echo "live_ok=false" >> "$GITHUB_OUTPUT"
            echo "NEWS_MODE=live · collector failure/fallback/indeterminate — fail-closed, no send"
          fi

      # 3) 전용 sent ledger 기준 신규 Tier 1 중요·최우선 AI 기사, 또는 Tier 1 부재 시
      #    Tier 2 강한 관찰 신호 최대 1건을 Teams 채널에 발송한다 — R4-OPS-10H.
      #    shadow_alert_delta는 발송 조건이 아니다(중요도는 app.teams_ai_push의 기사별 재사용 신호로 판정) — D7-AK-6C.
      #    공식 production transport = email_channel: 검증된 Gmail SMTP(scripts/send_email_alert.py 계약 재사용)로
      #    Teams 채널 이메일(TEAMS_CHANNEL_EMAIL)로 보낸다(기사당 1통·다이제스트 병합 없음·run당 최대 5건,
      #    자격 있는 미발송 기사 수만큼만 선택하고 부족분 채우기 없음, 동일 이벤트는 핵심 10개 언론사 대표 1건으로 collapse).
      #    SMTP 250 accepted인 기사만 성공으로 판정해 dedup state에 남긴다(부분 실패는 실패 기사만 다음 run 재발송).
      #    수동 production canary는 watch=0에서도 production_canary=true + canary_cap=1일 때만
      #    정확히 한 건까지 허용한다. schedule은 watch=1일 때만 열리고 repository rollout cap
      #    TEAMS_AI_NEWS_MAX_ARTICLES를 사용한다(1~5 존중·>5는 5로 clamp·0/음수/비정상 값은 안전한 1,
      #    Variable 미설정 시 워크플로가 보수적으로 '1'을 주입 — 5건 배치 활성화는 운영자가 Variable을 5로 설정).
      - name: Teams AI news article cards (watch auto-send)
        id: teams_ai_push
        if: steps.build.outputs.live_ok == 'true' && github.ref == 'refs/heads/main' && github.event.inputs.force_dry_run != 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.production_canary == 'true') && (github.event_name != 'workflow_dispatch' || github.event.inputs.canary_cap == '1') && (github.event_name != 'schedule' || vars.TEAMS_AI_NEWS_WATCH == '1')
        env:
          TEAMS_AI_PUSH_MODE: send
          APPROVE_TEAMS_AI_PUSH: "true"
          # 발송 자격증명 — GitHub Secrets에서만 주입되며 값은 어떤 로그/artifact에도 출력되지 않는다.
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_SMTP_APP_PASSWORD: ${{ secrets.GMAIL_SMTP_APP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          TEAMS_CHANNEL_EMAIL: ${{ secrets.TEAMS_CHANNEL_EMAIL }}
          # 운영 dedup state(영속). 성공(250 accepted)한 기사만 여기에 기록되고 아래 step이 commit한다.
          TEAMS_PUSH_STATE_PATH: data/teams_push_state.json
          TEAMS_ARTIFACT_FILE: ${{ runner.temp }}/validated-live-brief.json
          TEAMS_AI_PUSH_MAX_ARTICLES: ${{ github.event_name == 'workflow_dispatch' && '1' || vars.TEAMS_AI_NEWS_MAX_ARTICLES || '1' }}
        run: python3 scripts/send_teams_ai_push.py

      # 4) SMTP accepted 기사만 영속 dedup state에 남긴다. 부분 실패로 위 step이 실패해도
      #    이미 발송된 기사는 재발송되면 안 되므로 always()로 진입하되, sender가 실제로 실행됐고
      #    (state_changed=true) 파일 변경이 있을 때만 state 파일 한 개만 commit한다.
      - name: Persist Teams AI push dedup state
        if: always() && steps.teams_ai_push.outcome != 'skipped' && steps.teams_ai_push.outputs.state_changed == 'true'
        run: |
          # 최초 성공 시 state 파일은 untracked로 생성되므로 git diff가 아니라 status로 본다.
          if [ -z "$(git status --porcelain -- data/teams_push_state.json)" ]; then
            echo "teams push state unchanged — skip commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/teams_push_state.json
          git commit -m "chore: persist Teams AI push dedup state"

          for attempt in 1 2 3; do
            echo "state persist attempt ${attempt}/3: fetch + merge-preserving-history + push"
            git fetch origin main

            if ! git merge --no-edit origin/main; then
              echo "ERROR: merge with origin/main failed during Teams state persist"
              git merge --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "teams push state committed: $(git rev-parse HEAD)"
              exit 0
            fi

            echo "WARN: git push failed on attempt ${attempt}/3"
            if [ "${attempt}" -eq 3 ]; then
              echo "ERROR: teams push state push failed after 3 attempts"
              exit 1
            fi

            sleep $((attempt * 5))
          done

      - name: Skip Teams send (watch closed or not main)
        if: always() && steps.teams_ai_push.outcome == 'skipped'
        run: echo "watch disabled / not main / force dry-run — skip teams"
