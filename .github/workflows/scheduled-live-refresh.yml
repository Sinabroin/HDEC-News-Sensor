name: Scheduled Live Refresh

# 매시간 라이브 리포트와 정확히 하나의 reference-locked News Censor 모델을 게시한다.
# 이 workflow는 알림 전송 상태를 소유하지 않으며 Teams/Telegram 발송을 실행하지 않는다.
on:
  workflow_dispatch:
    inputs:
      force_dry_run:
        description: "Type 'true' to build and verify without publishing"
        required: false
        default: ""
  schedule:
    # GitHub schedule은 UTC 기준이며 best-effort라 수분 지연될 수 있다.
    - cron: '17 * * * *'

# 공개 Pages는 main의 docs/를 서빙한다 — 갱신분을 commit/push 하려면 write 권한 필요.
permissions:
  contents: write

# 슬롯 실행을 직렬화해 겹침/중복 발송·git push 충돌을 막는다.
concurrency:
  group: scheduled-live-refresh
  cancel-in-progress: false

env:
  # 검증/기본은 항상 mock 안전 모드 (네트워크/비밀값 0건). live 수집은 게시/발송 step에서만 명시 활성화.
  APP_MODE: mock
  # 이 Pages 전용 workflow에는 sender step이 없다. Telegram은 계속 명시적으로 비활성화한다.
  TELEGRAM_AUTO_SEND: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  scheduled-refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install bounded image dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir "Pillow==12.3.0"

      # 1) 게이트 (mock-safe · 비밀값/네트워크 0건). 이 예약 경로의 핵심 verifier들.
      #    예약 발송 가드 + 사람 검토 게이트 + 리포트/대시보드/정직성 회귀 검사.
      - name: Verify pipeline (mock-safe, no secrets)
        run: |
          python3 -m py_compile scripts/build_news_censor.py scripts/audit_news_censor_funnel.py scripts/verify_news_censor.py scripts/verify_news_censor_reference_parity.py scripts/verify_news_censor_verified_state.py app/news_censor_verified_state.py scripts/verify_hourly_delta_auto_send.py app/delta_classifier.py scripts/verify_meaningful_delta_quality.py
          python3 scripts/verify_news_censor.py
          python3 scripts/verify_news_censor_verified_state.py
          python3 scripts/verify_teams_ai_push.py
          python3 scripts/verify_teams_push_state.py
          python3 scripts/verify_teams_ai_push_dry_run.py
          python3 scripts/verify_teams_ai_push_workflow_dry_run.py
          python3 scripts/verify_teams_ai_push_production.py
          python3 scripts/verify_hourly_delta_auto_send.py --skip-operator-verifier
          python3 scripts/verify_scheduled_refresh_and_telegram.py
          python3 scripts/verify_human_review_gate.py
          python3 scripts/verify_static_report.py
          python3 scripts/verify_dashboard_real_data.py
          python3 scripts/verify_naver_news_adapter.py
          python3 scripts/verify_thebell_watch_policy.py
          python3 scripts/verify_deal_watch_collection.py
          python3 scripts/verify_known_missed_news_coverage.py
          python3 scripts/verify_dashboard_accordion_sections.py
          python3 scripts/verify_dashboard_existing_rail_navigation.py
          python3 scripts/verify_hormuz_lens_relevance.py
          python3 scripts/verify_national_ai_infra_relevance.py
          python3 scripts/verify_teams_validated_brief_semantic_equivalence.py
          python3 scripts/verify_operator_controls.py
          python3 scripts/verify_ai_market_exposure_quality.py
          python3 scripts/verify_data_source_honesty.py
          python3 scripts/verify_site_article_sensing.py
          python3 scripts/verify_weather_risk.py
          python3 scripts/verify_market_source_audit.py
          # The exact NEW_CENSOR shell intentionally supersedes the retired
          # preview-dashboard UI contracts (operator buttons, legacy lens DOM,
          # Hormuz traffic card, simplification strip, RC3 public shell).  Their
          # underlying collectors remain covered above; the public UI is sealed
          # after the live artifact is rendered by the parity verifier below.

      # 2) live brief를 한 번 수집해 artifact로 고정한 뒤 모든 정적 소비자가 재사용한다.
      #    News Censor의 explicit collector-health gate가 live_ok를 판정한다. 실패(mock fallback,
      #    source failure, indeterminate health)면 작업 트리를 복원해 가짜 live 게시를 차단한다.
      #    ※ 공개 빌드는 비공개 감시 목록 경로(env)를 설정하지 않는다 — 감시 트리 미주입(사생활).
      - name: Build live report + dashboard
        id: build
        env:
          NEWS_MODE: live
          # Naver 보조 provider — 이미 생성된 repo secrets로 안전 주입 (값 미출력). 자격증명이
          # 없거나 실패해도 collector가 정직하게 skip하므로 live_ok 판정에는 영향이 없다.
          NAVER_NEWS_ENABLED: "1"
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          MACRO_MODE: live
          # 이 step의 시장지표 snapshot을 휘발 파일로 남겨 아래 다이제스트 step이 동일 값을 쓰게 한다.
          MACRO_SNAPSHOT_FILE: ${{ runner.temp }}/macro_snapshot.json
          # R4-R4 public-display-only verified cache.  The independent Teams watch
          # workflow does not set this path and therefore never receives carry-forward.
          NEWS_CENSOR_VERIFIED_STATE_PATH: data/news_censor_verified_state.json
          # 운영자 버튼이 호출할 공개 Operator API base URL (비밀값 아님 · repo variable).
          # 미설정이면 3개 실행 버튼을 비활성화하고 Operator API 미연결을 명시한다.
          OPERATOR_API_BASE: ${{ vars.OPERATOR_API_BASE }}
        run: |
          BRIEF_JSON="$RUNNER_TEMP/validated-live-brief.json"
          python3 scripts/build_executive_brief.py \
            --output-json "$BRIEF_JSON" \
            --weather-mode live
          if VALIDATION="$(TEAMS_AI_NEWS_WATCH=0 TELEGRAM_AUTO_SEND=0 \
            python3 scripts/build_news_censor.py \
              --brief-json "$BRIEF_JSON" \
              --require-live \
              --json 2>&1)"; then
            echo "$VALIDATION"
            python3 scripts/build_static_report.py \
              --brief-json "$BRIEF_JSON" \
              --output docs/daily/latest.html \
              --audience executive
            # 공개 latest.html은 항상 executive 뷰 (operator 기본값 유출 방지, P0-D3R).
            python3 scripts/build_static_report.py \
              --brief-json "$BRIEF_JSON" \
              --output docs/daily/operator-latest.html \
              --audience operator
            # SHA-pinned exact-reference News Censor를 한 번 렌더해 compatibility/canonical
            # 두 경로에 동일 byte로 쓴다. 공개 dashboard는 Teams sent ledger가 아니다.
            TEAMS_AI_NEWS_WATCH=0 TELEGRAM_AUTO_SEND=0 \
              python3 scripts/build_news_censor.py \
                --brief-json "$BRIEF_JSON" \
                --output-root docs/news-censor \
                --canonical-output docs/daily/dashboard-latest.html \
                --require-live \
                --image-mode live
            python3 scripts/verify_news_censor_reference_parity.py \
              --brief-json "$BRIEF_JSON" \
              --candidate docs/news-censor/latest.html \
              --candidate docs/daily/dashboard-latest.html
            TEAMS_AI_NEWS_WATCH=0 TELEGRAM_AUTO_SEND=0 \
              python3 scripts/audit_news_censor_funnel.py \
                --brief-json "$BRIEF_JSON" \
                --html docs/news-censor/latest.html \
                --output-json "$RUNNER_TEMP/news-censor-funnel-audit.json" \
                --require-live
            echo "live_ok=true" >> "$GITHUB_OUTPUT"
            echo "NEWS_MODE=live · one validated artifact published to report + exact shared News Censor paths"
          else
            echo "$VALIDATION"
            echo "live_ok=false" >> "$GITHUB_OUTPUT"
            echo "NEWS_MODE=live · collector failure/fallback/indeterminate artifact — NOT publishing"
            git checkout -- docs/daily/latest.html docs/daily/operator-latest.html docs/daily/dashboard-latest.html docs/news-censor data/news_censor_verified_state.json || true
          fi

      # 3) live 성공 시에만 갱신분을 main에 commit/push → 공개 Pages 갱신 (변경 없으면 skip).
      - name: Publish to Pages (commit live docs)
        if: steps.build.outputs.live_ok == 'true' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || github.event.inputs.force_dry_run != 'true')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DOCS=(
            docs/daily/latest.html
            docs/daily/operator-latest.html
            docs/daily/dashboard-latest.html
            docs/news-censor
            data/news_censor_verified_state.json
          )

          if git diff --quiet -- "${DOCS[@]}"; then
            echo "live docs unchanged — skip commit"
          else
            git add -- "${DOCS[@]}"
            git commit -m "chore: scheduled live refresh"

            for attempt in 1 2 3; do
              echo "publish attempt ${attempt}/3: fetch + merge-preserving-history + push"
              git fetch origin main

              if ! git merge --no-edit origin/main; then
                echo "ERROR: merge with origin/main failed during scheduled publish"
                git merge --abort || true
                exit 1
              fi

              if git push origin HEAD:main; then
                echo "scheduled live docs committed and pushed"
                exit 0
              fi

              echo "WARN: git push failed on attempt ${attempt}/3"
              if [ "${attempt}" -eq 3 ]; then
                echo "ERROR: scheduled live docs push failed after 3 attempts"
                exit 1
              fi

              sleep $((attempt * 5))
            done
          fi

      # Teams article sends and data/teams_push_state.json remain exclusively owned by
      # teams-ai-news-watch.yml. Telegram remains disabled and has no sender step here.
