name: Editorial Daily Brief

on:
  workflow_dispatch:
    inputs:
      force_dry_run:
        description: "Run offline preview only"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      publish_only:
        description: "Regenerate the current edition without delivery"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  schedule:
    # R4-R10 — these runs MUST start after the Editorial Review Console build
    # (editorial-review-console.yml, cron "20 22") so the dated console
    # docs/editorial/review/<edition>/index.html already exists when the brief
    # publishes. R4-R11 — the reader-only degradation is removed: when the
    # dated console, review bundle, editor identity, or manifest-to-console
    # reconstruction is unavailable the publication SKIPS fail-closed with a
    # machine-readable skip_reason, and these three staggered runs are the
    # only retry path. A delivered Daily always carries the exact-edition
    # editor CTA (Daily Brief 편집기에서 열기).
    # R4-OPS-5: 07:20 Editor first, then an 08:00-target primary and two
    # idempotent retries. GitHub cron remains best-effort; state is the duplicate
    # authority, not the wall clock.
    - cron: "50 22 * * *" # 07:50 KST primary
    - cron: "5 23 * * *"  # 08:05 KST retry
    - cron: "15 23 * * *" # 08:15 KST final retry

permissions:
  contents: write

concurrency:
  group: editorial-daily-brief
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install editorial image dependency
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir "Pillow==12.3.0"

      - name: Verify editorial contracts offline
        run: |
          python3 -m py_compile app/editorial_briefings.py app/editorial_briefing_state.py scripts/run_editorial_briefing.py scripts/verify_daily_editor_deep_link.py scripts/verify_daily_lead_source_gate.py scripts/verify_daily_immutable_edition_manifest.py scripts/verify_r4_ops7_daily_production_gate.py scripts/verify_r4_ops7_real_photo_gate.py
          python3 scripts/verify_daily_editor_deep_link.py
          python3 scripts/verify_daily_lead_source_gate.py
          python3 scripts/verify_daily_immutable_edition_manifest.py
          python3 scripts/verify_r4_ops7_real_photo_gate.py
          python3 scripts/verify_r4_ops7_daily_production_gate.py

      - name: Offline preview when production gate is closed
        if: github.ref != 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.force_dry_run == 'true')
        run: |
          python3 scripts/run_editorial_briefing.py \
            --edition-type daily \
            --preview \
            --preview-root "$RUNNER_TEMP/editorial-preview"

      - name: Build Daily publication
        id: publish
        if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || github.event.inputs.force_dry_run != 'true')
        env:
          EDITORIAL_PRODUCTION: "1"
          EDITORIAL_RUNTIME_DIR: ${{ runner.temp }}/editorial-daily
          NEWS_MODE: live
          NAVER_NEWS_ENABLED: "1"
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          REPORT_URL: ${{ vars.REPORT_URL || secrets.REPORT_URL || '' }}
        run: |
          PUBLISH_FLAG="--publish"
          if [ "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_only == 'true' }}" = "true" ]; then
            PUBLISH_FLAG="--republish"
          fi
          python3 scripts/run_editorial_briefing.py \
            --edition-type daily \
            "$PUBLISH_FLAG" \
            --runtime-dir "$EDITORIAL_RUNTIME_DIR"

      - name: Commit and push exact Daily publication files
        if: steps.publish.outputs.skipped == 'false'
        env:
          EDITION: ${{ steps.publish.outputs.edition }}
          EDITION_MANIFEST_PATH: ${{ steps.publish.outputs.edition_manifest_path }}
          IMAGE_MANIFEST_PATH: ${{ steps.publish.outputs.image_manifest_path }}
        run: |
          DATED_PATH="docs/editorial/daily/${EDITION}.html"
          LATEST_PATH="docs/editorial/daily/latest.html"
          FILES=("$DATED_PATH" "$LATEST_PATH")
          if [ -n "$EDITION_MANIFEST_PATH" ]; then
            FILES+=("$EDITION_MANIFEST_PATH")
          fi
          if [ -n "$IMAGE_MANIFEST_PATH" ]; then
            FILES+=("$IMAGE_MANIFEST_PATH")
            mapfile -t IMAGE_PATHS < <(python3 - "$IMAGE_MANIFEST_PATH" "$EDITION" <<'PY'
          import json, pathlib, sys
          manifest_path, edition = pathlib.Path(sys.argv[1]), sys.argv[2]
          payload = json.loads(manifest_path.read_text(encoding="utf-8"))
          prefix = f"editorial/daily/assets/{edition}/"
          if payload.get("edition_type") != "daily" or payload.get("edition_key") != edition:
              raise SystemExit("image manifest identity mismatch")
          rows = payload.get("publication_image_assets")
          if not isinstance(rows, list) or len(rows) != payload.get("article_count"):
              raise SystemExit("image manifest asset count mismatch")
          for row in rows:
              relative = str(row.get("relative_path") or "")
              name = relative.removeprefix(prefix)
              if not relative.startswith(prefix) or not name or "/" in name or "\\" in name:
                  raise SystemExit("unsafe Daily image asset path")
              print("docs/" + relative)
          PY
            )
            FILES+=("${IMAGE_PATHS[@]}")
          fi
          if [ -z "$(git status --porcelain -- "${FILES[@]}")" ]; then
            echo "Daily publication already matches; continue to public verification"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$DATED_PATH" "$LATEST_PATH"
          if [ -n "$EDITION_MANIFEST_PATH" ]; then
            git add -- "$EDITION_MANIFEST_PATH"
          fi
          if [ -n "$IMAGE_MANIFEST_PATH" ]; then
            git add -- "$IMAGE_MANIFEST_PATH" "${IMAGE_PATHS[@]}"
          fi
          git commit -m "chore: publish Daily editorial brief ${EDITION}"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git merge --no-edit origin/main; then
              echo "ERROR: Daily publication merge conflict; fail closed"
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: Daily publication push failed"
              exit 1
            fi
          done

      - name: Verify public immutable Daily resources before claim
        id: verify_public
        if: success() && steps.publish.outputs.delivery_authorized == 'true'
        env:
          EDITORIAL_PRODUCTION: "1"
          EDITORIAL_RUNTIME_DIR: ${{ runner.temp }}/editorial-daily
          REPORT_URL: ${{ vars.REPORT_URL || secrets.REPORT_URL || '' }}
        run: |
          # R4-R12 §6 step 10 — the dated reader page AND the content-addressed
          # immutable edition manifest must publicly resolve and reconstruct
          # before the edition is claimed or sent. Failure fails the job closed
          # (daily_public_resource_verification_failed); the claim/send steps
          # below are gated on success() so they never run reader-only.
          python3 scripts/run_editorial_briefing.py \
            --edition-type daily \
            --verify-public \
            --runtime-dir "$EDITORIAL_RUNTIME_DIR"

      - name: Claim exact Daily edition after public verification
        id: claim
        if: success() && steps.verify_public.outputs.resources_verified == 'true'
        env:
          EDITORIAL_PRODUCTION: "1"
          EDITORIAL_RUNTIME_DIR: ${{ runner.temp }}/editorial-daily
          REPORT_URL: ${{ vars.REPORT_URL || secrets.REPORT_URL || '' }}
        run: |
          python3 scripts/run_editorial_briefing.py \
            --edition-type daily \
            --claim \
            --runtime-dir "$EDITORIAL_RUNTIME_DIR"

      - name: Commit and push exact Daily claim state file
        if: success() && steps.claim.outputs.state_changed == 'true'
        env:
          EDITION: ${{ steps.claim.outputs.edition }}
        run: |
          STATE_PATH="data/editorial_daily_state.json"
          if [ -z "$(git status --porcelain -- "$STATE_PATH")" ]; then
            echo "ERROR: Daily claim state output was declared but file is unchanged"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$STATE_PATH"
          git commit -m "chore: claim Daily editorial delivery ${EDITION}"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git merge --no-edit origin/main; then
              echo "ERROR: Daily claim state merge conflict; fail closed"
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: Daily claim state push failed"
              exit 1
            fi
          done

      - name: Send claimed Daily edition
        id: send
        if: success() && steps.claim.outputs.send_authorized == 'true'
        env:
          EDITORIAL_PRODUCTION: "1"
          EDITORIAL_RUNTIME_DIR: ${{ runner.temp }}/editorial-daily
          REPORT_URL: ${{ vars.REPORT_URL || secrets.REPORT_URL || '' }}
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_SMTP_APP_PASSWORD: ${{ secrets.GMAIL_SMTP_APP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          TEAMS_CHANNEL_EMAIL: ${{ secrets.TEAMS_CHANNEL_EMAIL }}
        run: |
          python3 scripts/run_editorial_briefing.py \
            --edition-type daily \
            --send \
            --runtime-dir "$EDITORIAL_RUNTIME_DIR"

      - name: Commit and push exact Daily success state file
        if: success() && steps.send.outputs.state_changed == 'true'
        env:
          EDITION: ${{ steps.claim.outputs.edition }}
        run: |
          STATE_PATH="data/editorial_daily_state.json"
          if [ -z "$(git status --porcelain -- "$STATE_PATH")" ]; then
            echo "ERROR: Daily success state output was declared but file is unchanged"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$STATE_PATH"
          git commit -m "chore: record Daily editorial delivery ${EDITION}"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git merge --no-edit origin/main; then
              echo "ERROR: Daily success state merge conflict; fail closed"
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: Daily success state push failed"
              exit 1
            fi
          done
