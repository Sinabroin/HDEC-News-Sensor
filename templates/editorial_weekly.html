<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{PAGE_TITLE}}</title>
<style>{{BRIEF_STYLES}}</style>
</head>
<body>
<main class="brief-page" data-brief-contract="AI_TNI_EXECUTIVE_V1" data-edition-type="weekly" data-edition-key="{{EDITION_KEY}}" style="max-width:680px;margin:0 auto;padding:64px 20px 56px">
  <header class="masthead">
    <div class="brandmark" style="display:inline-block;background:#002c5f;color:#fff;padding:9px 25px;border-radius:999px;font-weight:800">AI 경영 T&amp;I</div>
    <h1>Weekly Brief</h1>
    <p class="desc">AI디자인랩이 매주 전하는 경영진용 Trend &amp; Insight</p>
    <div class="issue">{{EDITION_LABEL}} · {{COVERAGE_LABEL}}</div>
  </header>
  <section class="section" aria-labelledby="headline-label">
    <h2 class="section-label" id="headline-label">이번 주 헤드라인</h2>
    {{HEADLINE_HTML}}
  </section>
  <section class="section" aria-labelledby="briefing-label">
    <h2 class="section-label" id="briefing-label">이번 주 브리핑</h2>
    <div class="cards">{{ARTICLE_CARDS_HTML}}</div>
  </section>
  <section class="section" aria-labelledby="taxonomy-label">
    <h2 class="section-label" id="taxonomy-label">정보 분류 기준</h2>
    {{TAXONOMY_HTML}}
  </section>
  {{FOOTER_HTML}}
</main>
</body>
</html>
