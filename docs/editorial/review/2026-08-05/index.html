<script>
const bundle=JSON.parse(document.getElementById("candidate-data").textContent);
const CATEGORY_ORDER=["투자·산업","기업동향","기술정보"];
const MAX_SELECTED=6;
const MAX_MANUAL_CANDIDATES=12;
const MAX_IMPORTED_IMAGE_DATA_URL=350000;
const articleImportApiUrl=safeImportApiUrl(bundle.article_import_api_url);
const storageKey=`hdec-editorial-review-v2:${bundle.edition_key}`;
const dimensionLabels={business_relevance:"업무 관련성",importance:"기사 중요도",source_reliability:"출처 신뢰도",specificity:"정보 구체성",executive_value:"임원 보고 가치",novelty:"새로움"};
const exclusionLabels={low_trust_source:"듣보잡·신뢰도 낮음",promotional:"홍보성",clickbait:"제목 낚시",shallow:"내용이 얕음",duplicate:"중복 기사",low_hdec_relevance:"현대건설 관련성 낮음",not_ai:"AI 직접 관련 없음",stale:"오래된 기사",stock_market_noise:"증권·주가성",fact_check_needed:"사실 확인 부족"};
const defaultSelected=bundle.candidates.filter(x=>x.ai_recommended).slice(0,MAX_SELECTED).map(x=>x.candidate_id);
let state={selected:[...defaultSelected],ratings:{},manualCandidates:[],edits:{},reviewStatus:"draft"};
try{
  const saved=JSON.parse(localStorage.getItem(storageKey));
  if(saved&&Array.isArray(saved.selected))state={...state,...saved};
}catch(error){}
state.manualCandidates=Array.isArray(state.manualCandidates)?state.manualCandidates:[];
state.ratings=state.ratings&&typeof state.ratings==="object"?state.ratings:{};
state.edits=state.edits&&typeof state.edits==="object"?state.edits:{};
state.selected=[...new Set(state.selected)].slice(0,MAX_SELECTED);
state.manualCandidates=state.manualCandidates.slice(0,MAX_MANUAL_CANDIDATES).map(candidate=>({
  ...candidate,
  image_url:safeImageUrl(candidate.image_url)
}));
let lastEditable=null;
let dragging=null;
let importController=null;
const INTERACTIVE_SELECTOR="a,button,input,select,textarea,summary,[contenteditable='true']";

function esc(value){
  return String(value??"").replace(/[&<>"']/g,match=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[match]));
}
function safeUrl(value){
  try{
    const parsed=new URL(String(value));
    return ["http:","https:"].includes(parsed.protocol)?parsed.href:"";
  }catch(error){return "";}
}
function safeAuthorityUrl(value){
  const candidate=safeUrl(value);
  if(!candidate)return "";
  try{
    const parsed=new URL(candidate);
    const host=parsed.hostname.toLowerCase().replace(/\.$/,"");
    if(parsed.username||parsed.password)return "";
    if(parsed.port&&parsed.port!==(parsed.protocol==="https:"?"443":"80"))return "";
    if(host==="localhost"||host.includes(":")||/^\d+(?:\.\d+){3}$/.test(host))return "";
    if([".local",".internal",".localhost",".intranet",".home",".lan"].some(suffix=>host.endsWith(suffix)))return "";
    const blocked=["news.daum.net","v.daum.net","media.daum.net","news.naver.com","n.news.naver.com","m.news.naver.com","news.google.com","msn.com","news.yahoo.com","bit.ly","t.co","tinyurl.com","goo.gl","han.gl","me2.do","vo.la","url.kr"];
    if(blocked.some(domain=>host===domain||host.endsWith(`.${domain}`)))return "";
    if(["google.com","bing.com","search.naver.com","search.daum.net"].some(domain=>host===domain||host.endsWith(`.${domain}`)))return "";
    if(parsed.pathname.toLowerCase().includes("/search"))return "";
    return candidate;
  }catch(error){return "";}
}
function safeImportApiUrl(value){
  try{
    const parsed=new URL(String(value||""));
    const loopback=["localhost","127.0.0.1","::1"].includes(parsed.hostname);
    if(parsed.username||parsed.password||parsed.search||parsed.hash)return "";
    if(parsed.pathname.replace(/\/+$/,"")!=="/api/editorial/import-article")return "";
    if(parsed.protocol!=="https:"&&!(parsed.protocol==="http:"&&loopback))return "";
    return parsed.href.replace(/\/+$/,"");
  }catch(error){return "";}
}
function safeImageUrl(value){
  const candidate=String(value??"").trim();
  if(/^assets\/images\/[A-Za-z0-9._-]+$/.test(candidate))return candidate;
  if(candidate.length>MAX_IMPORTED_IMAGE_DATA_URL)return "";
  const match=candidate.match(/^data:image\/(jpeg|png|webp);base64,([A-Za-z0-9+/]+={0,2})$/);
  if(!match)return "";
  const payload=match[2];
  if(match[1]==="jpeg"&&!payload.startsWith("/9j/"))return "";
  if(match[1]==="png"&&!payload.startsWith("iVBORw0KGgo"))return "";
  if(match[1]==="webp"&&!payload.startsWith("UklGR"))return "";
  return candidate;
}
function sanitizeInline(html){
  const box=document.createElement("div");
  box.innerHTML=String(html||"");
  function clean(node){
    if(node.nodeType===Node.TEXT_NODE)return document.createTextNode(node.nodeValue||"");
    if(node.nodeType!==Node.ELEMENT_NODE)return document.createTextNode("");
    const tag=node.tagName.toLowerCase();
    const fragment=document.createDocumentFragment();
    [...node.childNodes].forEach(child=>fragment.appendChild(clean(child)));
    if(tag==="br")return document.createElement("br");
    if(tag==="strong"||tag==="b"){
      const element=document.createElement("strong");
      element.appendChild(fragment);
      return element;
    }
    return fragment;
  }
  const output=document.createElement("div");
  [...box.childNodes].forEach(node=>output.appendChild(clean(node)));
  return output.innerHTML.replace(/(?:<br>\s*){3,}/g,"<br><br>");
}
function plain(html){
  const box=document.createElement("div");
  box.innerHTML=sanitizeInline(html);
  return box.textContent.replace(/\s+/g," ").trim();
}
function save(){
  try{
    localStorage.setItem(storageKey,JSON.stringify(state));
    document.getElementById("saveState").textContent="저장됨 "+new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});
  }catch(error){
    document.getElementById("saveState").textContent="저장 공간 부족";
    setImportStatus("이미지 저장 공간이 부족합니다. 불필요한 URL 기사를 삭제해 주세요.","error");
  }
}
function allCandidates(){return [...bundle.candidates,...state.manualCandidates];}
function byId(id){return allCandidates().find(candidate=>candidate.candidate_id===id);}
function edit(id){
  const candidate=byId(id);
  return state.edits[id]||(state.edits[id]={
    title:candidate?.title||"",
    summary_html:candidate?.summary_html||esc(candidate?.summary||""),
    category:CATEGORY_ORDER.includes(candidate?.category)?candidate.category:"기술정보"
  });
}
function view(id){
  const candidate=byId(id);
  if(!candidate)return null;
  const changes=edit(id);
  const summaryHtml=sanitizeInline(changes.summary_html||candidate.summary_html||esc(candidate.summary||""));
  return {
    ...candidate,
    title:changes.title||candidate.title,
    summary_html:summaryHtml,
    summary:plain(summaryHtml),
    category:CATEGORY_ORDER.includes(changes.category)?changes.category:"기술정보"
  };
}
function rating(id){
  return state.ratings[id]||(state.ratings[id]={overall_rating:0,dimension_ratings:{},exclusion_tags:[],note:""});
}
function categoryClass(category){
  return category==="투자·산업"?"ticker-invest":category==="기업동향"?"ticker-corp":"ticker-tech";
}
function categoryOptions(value){
  return CATEGORY_ORDER.map(category=>`<option ${category===value?"selected":""}>${esc(category)}</option>`).join("");
}
function imageMarkup(candidate,extraClass=""){
  const imageUrl=safeImageUrl(candidate.image_url);
  const fallbackHidden=imageUrl?" hidden":"";
  return `<div class="image-frame ${esc(extraClass)}" data-image-frame>${imageUrl?`<img src="${esc(imageUrl)}" alt="${esc(candidate.title)}" loading="lazy" decoding="async">`:""}<div class="image-fallback"${fallbackHidden}>이미지 없음</div></div>`;
}
function bindImageFallbacks(root=document){
  root.querySelectorAll("[data-image-frame]").forEach(frame=>{
    const image=frame.querySelector("img");
    const fallback=frame.querySelector(".image-fallback");
    if(!image||!fallback)return;
    const failed=()=>{image.hidden=true;fallback.hidden=false;frame.dataset.imageFallback="true";};
    const loaded=()=>{if(image.naturalWidth>0){image.hidden=false;fallback.hidden=true;frame.dataset.imageLoaded="true";}else failed();};
    image.addEventListener("error",failed,{once:true});
    image.addEventListener("load",loaded,{once:true});
    if(image.complete)(image.naturalWidth>0?loaded:failed)();
  });
}
function normalizeSelectedOrder(){
  state.selected=CATEGORY_ORDER.flatMap(category=>
    state.selected.filter(id=>view(id)?.category===category)
  );
}
function markDraftAndRender(){
  state.reviewStatus="draft";
  save();
  render();
}
function moveArticle(id,targetCategory,targetId=null,placeAfter=false){
  if(!CATEGORY_ORDER.includes(targetCategory)||!byId(id))return false;
  const alreadySelected=state.selected.includes(id);
  if(!alreadySelected&&state.selected.length>=MAX_SELECTED){
    alert("최대 6건까지 선택할 수 있습니다.");
    renderCandidates();
    return false;
  }
  state.selected=state.selected.filter(selectedId=>selectedId!==id);
  edit(id).category=targetCategory;
  const groups=Object.fromEntries(CATEGORY_ORDER.map(category=>[
    category,
    state.selected.filter(selectedId=>view(selectedId)?.category===category)
  ]));
  const targetGroup=groups[targetCategory];
  let index=targetId?targetGroup.indexOf(targetId):-1;
  if(index<0)index=targetGroup.length;
  else if(placeAfter)index+=1;
  targetGroup.splice(index,0,id);
  state.selected=CATEGORY_ORDER.flatMap(category=>groups[category]);
  markDraftAndRender();
  return true;
}
function toggleSelected(id,checked){
  if(checked){
    if(state.selected.includes(id))return;
    moveArticle(id,view(id)?.category||"기술정보");
    return;
  }
  state.selected=state.selected.filter(selectedId=>selectedId!==id);
  markDraftAndRender();
}

function toggleTag(id,tag){
  const record=rating(id);

function removeManual(id){

function setDragData(event,kind,id){
  dragging={kind,id};
  if(!event.dataTransfer)return;
  event.dataTransfer.effectAllowed=kind==="candidate"?"copyMove":"move";
  event.dataTransfer.setData(kind==="candidate"?"candidate_id":"selected_id",id);
  event.dataTransfer.setData("text/plain",id);
}
function dragPayload(event){
  const selectedId=event.dataTransfer?.getData("selected_id");
  const candidateId=event.dataTransfer?.getData("candidate_id");
  if(selectedId)return {kind:"selected",id:selectedId};
  if(candidateId)return {kind:"candidate",id:candidateId};
  return dragging;
}

function renderCandidates(){
  const query=document.getElementById("search").value.trim().toLowerCase();
  const filter=document.getElementById("filter").value;
  const rows=allCandidates().filter(candidate=>{
    const record=rating(candidate.candidate_id);
    const current=view(candidate.candidate_id);
    const text=(current.title+" "+candidate.source+" "+current.summary+" "+candidate.selected_url).toLowerCase();
    if(query&&!text.includes(query))return false;
    if(filter==="selected"&&!state.selected.includes(candidate.candidate_id))return false;
    if(filter==="recommended"&&!candidate.ai_recommended)return false;
    if(filter==="human"&&candidate.origin!=="human_link")return false;
    if(filter==="rated-low"&&!(record.overall_rating>0&&record.overall_rating<=2))return false;
    if(filter==="unrated"&&record.overall_rating>0)return false;
    return true;
  });
  const root=document.getElementById("candidateList");
  root.innerHTML=rows.map(candidateCard).join("");
  root.querySelectorAll(".candidate").forEach(card=>{
    const id=card.dataset.id;
    card.addEventListener("dragstart",event=>{
      if(event.target.closest(INTERACTIVE_SELECTOR)){event.preventDefault();return;}
      setDragData(event,"candidate",id);
      card.classList.add("dragging");
    });
    card.addEventListener("dragend",()=>{dragging=null;card.classList.remove("dragging");});
    card.querySelector('input[type="checkbox"]').addEventListener("change",event=>toggleSelected(id,event.target.checked));
    card.querySelectorAll("a").forEach(link=>link.addEventListener("click",event=>event.stopPropagation()));
    card.querySelectorAll("[data-star]").forEach(button=>button.addEventListener("click",()=>setOverall(id,Number(button.dataset.star))));
    card.querySelectorAll("[data-tag]").forEach(button=>button.addEventListener("click",()=>toggleTag(id,button.dataset.tag)));
    card.querySelectorAll("[data-dim]").forEach(select=>select.addEventListener("change",()=>{rating(id).dimension_ratings[select.dataset.dim]=Number(select.value)||null;save();}));
    card.querySelector(".note").addEventListener("input",event=>{rating(id).note=event.target.value;save();});
    const remove=card.querySelector(".remove-manual");
    if(remove)remove.addEventListener("click",()=>removeManual(id));
  });
  bindImageFallbacks(root);
}
function setImportStatus(message,kind=""){
  const status=document.getElementById("importStatus");

function canonicalKey(value){
  const safe=safeUrl(value);
  if(!safe)return "";
  try{
    const parsed=new URL(safe);
    parsed.hash="";
    parsed.hostname=parsed.hostname.toLowerCase();
    if((parsed.protocol==="https:"&&parsed.port==="443")||(parsed.protocol==="http:"&&parsed.port==="80"))parsed.port="";
    parsed.pathname=parsed.pathname.replace(/\/+$/,"")||"/";
    return parsed.href;
  }catch(error){return "";}
}
function duplicateByUrl(value){
  const key=canonicalKey(value);
  return key?allCandidates().find(candidate=>canonicalKey(candidate.selected_url)===key):null;
}
function showManualFallback(url){
  const fallback=document.getElementById("manualFallback");

function normalizedImportedArticle(article){
  if(!article||typeof article!=="object")return null;
  const canonicalUrl=safeAuthorityUrl(article.canonical_url);
  const title=String(article.title||"").trim().slice(0,500);
  const source=String(article.source||"").trim().slice(0,160);
  const summary=String(article.summary||"").trim().slice(0,500);
  const category=CATEGORY_ORDER.includes(article.category)?article.category:"";
  const analysis=article.category_analysis;
  const analysisValid=analysis&&typeof analysis==="object"&&analysis.category===category&&analysis.scores&&typeof analysis.scores==="object"&&analysis.matched_signals&&typeof analysis.matched_signals==="object"&&typeof analysis.reason==="string";
  if(!canonicalUrl||!title||!source||!summary||!category||!analysisValid||article.publisher_direct!==true||article.portal_fallback_used===true)return null;
  return {
    input_url:safeUrl(article.input_url),
    discovery_url:safeUrl(article.discovery_url),
    canonical_url:canonicalUrl,
    publisher_url:safeUrl(article.publisher_url)||canonicalUrl,
    publisher_domain:String(article.publisher_domain||"").trim().slice(0,255),
    publisher_direct:article.publisher_direct===true,
    portal_source:String(article.portal_source||"").trim().slice(0,40),
    portal_resolution_reason:String(article.portal_resolution_reason||"").trim().slice(0,120),
    portal_fallback_used:article.portal_fallback_used===true,
    title,
    source,
    summary,
    summary_html:sanitizeInline(article.summary_html||esc(summary)),
    published_at:typeof article.published_at==="string"&&article.published_at?article.published_at:null,
    category,
    category_analysis:analysis,
    article_text_excerpt:String(article.article_text_excerpt||"").slice(0,1200),
    image_url:safeImageUrl(article.image_url),
    extraction:article.extraction&&typeof article.extraction==="object"?article.extraction:{}
  };
}
async function importArticleFromUrl(){
  const button=document.getElementById("importBtn");
  const input=document.getElementById("importUrl");
  if(importController){
    importController.abort();
    return;
  }
  if(!articleImportApiUrl){
    setImportStatus("기사 자동 불러오기 API가 설정되지 않았습니다.","error");
    return;
  }
  const inputUrl=safeUrl(input.value);
  if(!inputUrl){
    setImportStatus("http 또는 https 기사 URL을 입력해 주세요.","error");
    return;
  }
  if(duplicateByUrl(inputUrl)){
    setImportStatus("이미 후보에 있는 기사 URL입니다.","error");
    return;
  }
  if(state.selected.length>=MAX_SELECTED){
    setImportStatus("선택 기사는 최대 6건입니다. 한 건을 해제한 뒤 불러와 주세요.","error");
    return;
  }
  if(state.manualCandidates.length>=MAX_MANUAL_CANDIDATES){
    setImportStatus("URL·직접 입력 후보는 최대 12건까지 보관할 수 있습니다.","error");
    return;
  }
  importController=new AbortController();
  button.textContent="취소";
  input.disabled=true;
  setImportStatus("기사 본문과 이미지를 안전하게 분석하고 있습니다…","loading");
  try{
    const response=await fetch(articleImportApiUrl,{
      method:"POST",
      credentials:"include",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({url:inputUrl}),
      signal:importController.signal
    });
    let payload=null;
    try{payload=await response.json();}catch(error){}
    if(!response.ok||!payload?.ok){
      throw new Error(payload?.error?.message||"기사를 자동으로 불러오지 못했습니다.");
    }
    const article=normalizedImportedArticle(payload.article);
    if(!article)throw new Error("기사 응답 형식이 올바르지 않습니다.");
    if(duplicateByUrl(article.canonical_url)){
      setImportStatus("같은 원문 URL의 기사가 이미 후보에 있습니다.","error");
      return;
    }
    if(state.selected.length>=MAX_SELECTED){
      setImportStatus("선택 기사는 최대 6건입니다. 한 건을 해제한 뒤 다시 시도해 주세요.","error");
      return;
    }
    const id=`manual-import-${Date.now()}-${Math.random().toString(16).slice(2,8)}`;
    const publishedAt=article.published_at||bundle.coverage_end;
    const item={
      candidate_id:id,
      origin:"human_link",
      ai_rank:null,
      ai_recommended:false,
      title:article.title,
      summary:article.summary,
      summary_html:article.summary_html,
      source:article.source,
      published_at:publishedAt,
      published_at_fallback:article.published_at?"":"bundle_coverage_end",
      input_url:article.input_url||inputUrl,
      discovery_url:article.discovery_url,
      selected_url:article.canonical_url,
      publisher_url:article.publisher_url,
      publisher_domain:article.publisher_domain,
      publisher_direct:article.publisher_direct,
      portal_source:article.portal_source,
      portal_resolution_reason:article.portal_resolution_reason,
      portal_fallback_used:article.portal_fallback_used,
      link_kind:"publisher_direct",
      link_label:"불러온 원문",
      category:article.category,
      category_analysis:article.category_analysis,
      article_text_excerpt:article.article_text_excerpt,
      extraction:article.extraction,
      image_url:article.image_url,
      image_remote_url:"",
      image_source_kind:article.extraction.image_source||"fallback",
      image_fallback_used:!article.image_url,
      image_reason:article.extraction.image_result||"",
      image_quality_accepted:!!article.image_url,
      collection_source_kind:"url_import",
      selection_reason:"authenticated_url_import",
      feedback_adjustment:0,
      adjusted_score:0
    };
    state.manualCandidates.push(item);
    state.edits[id]={title:item.title,summary_html:item.summary_html,category:item.category};
    input.value="";
    document.getElementById("manualFallback").hidden=true;
    moveArticle(id,item.category);
    setImportStatus(`기사를 불러와 ${item.category} 섹터에 추가했습니다.`,"success");
  }catch(error){
    if(error?.name==="AbortError"){
      setImportStatus("기사 불러오기를 취소했습니다.","");
    }else{
      showManualFallback(inputUrl);
      setImportStatus(error?.message||"기사를 자동으로 불러오지 못했습니다.","error");
      button.dataset.retry="true";
    }
  }finally{
    importController=null;
    input.disabled=false;
    button.textContent=button.dataset.retry==="true"?"다시 시도":"기사 불러오기";
    delete button.dataset.retry;
  }
}

function bindDropTargets(){
  document.querySelectorAll(".selected-article-card").forEach(card=>{
    const id=card.dataset.selectedId;
    card.addEventListener("dragstart",event=>{
      if(event.target.closest(INTERACTIVE_SELECTOR)){event.preventDefault();return;}
      setDragData(event,"selected",id);
      card.classList.add("dragging");
    });
    card.addEventListener("dragend",()=>{dragging=null;card.classList.remove("dragging");});
    card.addEventListener("dragover",event=>{
      const payload=dragPayload(event);
      if(!payload||payload.id===id)return;
      event.preventDefault();
      const after=event.clientY>card.getBoundingClientRect().top+card.getBoundingClientRect().height/2;
      card.classList.toggle("drop-before",!after);
      card.classList.toggle("drop-after",after);
    });
    card.addEventListener("dragleave",()=>card.classList.remove("drop-before","drop-after"));
    card.addEventListener("drop",event=>{
      const payload=dragPayload(event);
      if(!payload||payload.id===id)return;
      event.preventDefault();
      event.stopPropagation();
      const box=card.getBoundingClientRect();
      const after=event.clientY>box.top+box.height/2;
      card.classList.remove("drop-before","drop-after");
      moveArticle(payload.id,card.dataset.selectedCategory,id,after);
    });
  });
  document.querySelectorAll(".sector-dropzone").forEach(zone=>{
    zone.addEventListener("dragover",event=>{
      if(!dragPayload(event))return;
      event.preventDefault();
      zone.classList.add("drag-over");
    });
    zone.addEventListener("dragleave",event=>{
      if(!zone.contains(event.relatedTarget))zone.classList.remove("drag-over");
    });
    zone.addEventListener("drop",event=>{
      const payload=dragPayload(event);
      if(!payload)return;
      event.preventDefault();
      zone.classList.remove("drag-over");
      moveArticle(payload.id,zone.dataset.dropCategory);
    });
  });
}

  const articleUrl=safeAuthorityUrl(candidate.selected_url);
  const source=articleUrl?`<a href="${esc(articleUrl)}" target="_blank" rel="noopener noreferrer">${esc(candidate.source)}</a>`:esc(candidate.source);
  return `<article class="article-card">${imageMarkup(candidate)}<div class="article-body"><span class="ticker ${categoryClass(candidate.category)}">${esc(candidate.category)}</span><h3>${esc(candidate.title)}</h3><p>${sanitizeInline(candidate.summary_html)}</p><div class="src">출처 ${source}</div></div></article>`;
}
function briefBody(selected){
  return `<header class="mast"><div class="brandmark">HDEC AI</div><h1>Daily Brief</h1><p>AI디자인랩이 매일 전하는 경영진용 Trend & Insight</p><div>${esc(bundle.edition_key)}</div></header>${CATEGORY_ORDER.map(category=>{const articles=selected.filter(candidate=>candidate.category===category);return `<section class="editorial-sector"><header class="sector-header"><h2 class="sector-title">${esc(category)}</h2><span class="sector-count">${articles.length}건</span></header>${articles.map(briefArticleCard).join("")}</section>`;}).join("")}<footer><b>발행 — 워크이노베이션센터 | AI디자인랩</b><br>외부 보도를 중심으로 요약한 자료이며 세부 내용은 원문 기준입니다.</footer>`;
}
function standaloneHtml(){
  const css=document.querySelector("style").textContent;
  const imageFallbackScript=`<script>document.querySelectorAll("[data-image-frame]").forEach(function(frame){var image=frame.querySelector("img"),fallback=frame.querySelector(".image-fallback");if(!image||!fallback)return;image.addEventListener("error",function(){image.hidden=true;fallback.hidden=false;});if(image.complete&&image.naturalWidth===0){image.hidden=true;fallback.hidden=false;}});<\/script>`;
  return `<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HDEC AI Daily Brief ${esc(bundle.edition_key)}</title><style>${css}</style></head><body style="background:#f2f3f6"><div class="preview" style="max-width:700px;margin:auto;padding:20px">${briefBody(state.selected.map(view).filter(Boolean))}</div>${imageFallbackScript}</body></html>`;
}
function download(name,text,type){
  const anchor=document.createElement("a");
  anchor.href=URL.createObjectURL(new Blob([text],{type}));
  anchor.download=name;
  anchor.click();
  setTimeout(()=>URL.revokeObjectURL(anchor.href),1000);
}
function selectedItems(){
  return state.selected.map(id=>{
    const candidate=view(id);
    return {candidate_id:candidate.candidate_id,origin:candidate.origin||"ai_collected",title:candidate.title,summary:candidate.summary,summary_html:sanitizeInline(candidate.summary_html),source:candidate.source,published_at:candidate.published_at,selected_url:safeAuthorityUrl(candidate.selected_url),link_kind:candidate.link_kind||"publisher_direct",link_label:candidate.link_label||"원문 보기",category:candidate.category,category_analysis:candidate.category_analysis||{},image_url:safeImageUrl(candidate.image_url),collection_source_kind:candidate.collection_source_kind||"",selection_reason:candidate.selection_reason||""};
  });
}
function feedbackRecords(){
  return allCandidates().map(candidate=>{
    const record=rating(candidate.candidate_id);
    const current=view(candidate.candidate_id);
    return {version:2,edition_key:bundle.edition_key,candidate_id:candidate.candidate_id,origin:candidate.origin||"ai_collected",selected_url:safeAuthorityUrl(candidate.selected_url),title:current.title,source:candidate.source,category:current.category,selected:state.selected.includes(candidate.candidate_id),selected_position:state.selected.indexOf(candidate.candidate_id)+1||null,overall_rating:record.overall_rating||0,dimension_ratings:record.dimension_ratings||{},exclusion_tags:record.exclusion_tags||[],note:record.note||"",rated_at:new Date().toISOString()};
  });
}

document.getElementById("search").addEventListener("input",renderCandidates);
document.getElementById("filter").addEventListener("change",renderCandidates);
document.getElementById("manualAddBtn").addEventListener("click",addManual);
document.getElementById("importBtn").addEventListener("click",importArticleFromUrl);
document.getElementById("importUrl").addEventListener("keydown",event=>{
  if(event.key==="Enter"){event.preventDefault();importArticleFromUrl();}
});
document.getElementById("restoreBtn").addEventListener("click",()=>{
  if(!confirm("초기화하면 현재 선택·편집·평가와 URL로 불러온 기사가 모두 사라집니다. AI 추천 상태로 되돌릴까요?"))return;
  state={selected:[...defaultSelected],ratings:{},manualCandidates:[],edits:{},reviewStatus:"draft"};
  normalizeSelectedOrder();
  markDraftAndRender();
  document.querySelector(".utility-menu").open=false;
  setImportStatus("AI 추천 상태로 초기화했습니다.","");
});
document.getElementById("boldBtn").addEventListener("mousedown",event=>{
  event.preventDefault();
  if(!lastEditable||lastEditable.dataset.field!=="summary_html"){alert("오른쪽 요약문에서 굵게 만들 텍스트를 먼저 선택하세요.");return;}
  lastEditable.focus();
  document.execCommand("bold",false,null);
  edit(lastEditable.dataset.id).summary_html=sanitizeInline(lastEditable.innerHTML);
  state.reviewStatus="draft";
  save();
});
document.getElementById("htmlBtn").addEventListener("click",()=>download(`HDEC_AI_Daily_Brief_${bundle.edition_key}.html`,standaloneHtml(),"text/html;charset=utf-8"));

normalizeSelectedOrder();
window.__editorialReviewDebug=()=>({
  selected:[...state.selected],
  reviewStatus:state.reviewStatus,
  categories:Object.fromEntries(state.selected.map(id=>[id,view(id)?.category||""])),
  manualCandidates:state.manualCandidates.map(candidate=>({
    candidate_id:candidate.candidate_id,
    selected_url:candidate.selected_url,
    category:view(candidate.candidate_id)?.category||"",
    image_url:candidate.image_url,
    collection_source_kind:candidate.collection_source_kind
  }))
});
render();
if(!articleImportApiUrl){
  document.getElementById("importUrl").disabled=true;
  document.getElementById("importBtn").disabled=true;
  setImportStatus("기사 자동 불러오기 API가 설정되지 않았습니다.","error");
}
</script>
</body>
</html>
